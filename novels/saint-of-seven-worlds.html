<script>
const chapters=[
["الفصل الأول — النجم الساقط",[
"كانت مدينة نيراف تستعد للنوم عندما ظهر الضوء في السماء. لم يكن ضوء قمر، ولا شعلة طائرة، ولا برقًا عابرًا. كان خطًا أزرق هائلًا يشق السماء من الشرق إلى الغرب، حتى إن الناس خرجوا من بيوتهم ورفعوا رؤوسهم في دهشة.",
"أما يامن، فكان واقفًا داخل الورشة الصغيرة التي ورثها عن والده. كان قد أمضى الساعات الثلاث الماضية يحاول إصلاح ساعة نحاسية قديمة، بينما يتسلل صوت المطر من النافذة الضيقة. لم يكن في المدينة ما يستحق الانتظار في تلك الليلة؛ لذلك كان ظهور الضوء كافيًا ليجعله يترك أدواته ويخرج.",
"وقف عند باب الورشة وحدق في الأفق. كان الضوء يختفي خلف جبال الصمت، ثم بعد لحظات اهتزت الأرض اهتزازًا خفيفًا. سقطت بعض الأدوات من الرفوف، وانطفأت المصابيح في الشوارع للحظة واحدة. لم يفكر يامن طويلًا. أغلق الورشة وأخذ مصباحه وبدأ السير خارج أسوار المدينة.",
"كان والده قد حذره منذ طفولته من الاقتراب من الجبال. قال له ذات مرة إن هناك أشياء في العالم لا ينبغي للإنسان أن يوقظها. يامن لم يفهم العبارة وقتها، وظن أنها واحدة من حكايات الكبار التي تُقال للأطفال حتى لا يبتعدوا عن بيوتهم. لكنه تذكرها الآن بوضوح غريب.",
"بعد ساعة من السير، وصل إلى الوادي الذي سقط فيه النجم. كانت الأشجار مكسورة في دائرة واسعة، والحجارة ساخنة رغم أن المطر كان لا يزال يهطل. وفي منتصف الحفرة وجد شيئًا لم يشبه أي حجر رآه في حياته.",
"كان حجرًا أسود بحجم قبضة اليد، أملس السطح، تتوسطه سبعة خطوط زرقاء رفيعة. لم تكن الخطوط تعكس الضوء؛ بل كانت تصدره من الداخل، كأن شيئًا حيًا ينبض تحت سطح الحجر.",
"مد يامن يده ثم توقف. شعر فجأة بأن أحدًا يراقبه. التفت خلفه فلم يجد سوى الأشجار والضباب. حاول أن يقنع نفسه بأن الخوف هو السبب، ثم عاد بنظره إلى الحجر.",
"ما إن لمسته حتى اختفى صوت المطر.",
"لم تختفِ السماء، ولم يتوقف الزمن، لكنه لم يعد يسمع شيئًا. وفي صمت لا يشبه أي صمت عرفه، رأى أمام عينيه سبع بوابات هائلة معلقة في فضاء أسود. خلف كل بوابة عالم مختلف: بحر بلا شاطئ، مدينة من البلور، غابة مضيئة، صحراء حمراء، جبل يطفو فوق السحاب، عالم مغطى بالثلج، وأخيرًا مكان لم يستطع عقله أن يصفه.",
"ثم سمع صوتًا لا يأتي من الخارج ولا من داخله: «لقد بدأت الرحلة.»",
"سحب يامن يده بعنف، فعاد صوت المطر دفعة واحدة. سقط على ركبتيه وهو يلهث. نظر إلى الحجر، فوجد أن أول خط من الخطوط السبعة قد أضاء بالكامل.",
"لم يكن يعرف ما الذي اختاره، ولا لماذا اختاره. كل ما عرفه في تلك اللحظة أن حياته القديمة انتهت، حتى لو عاد إلى نيراف وكأن شيئًا لم يحدث.",
"رفع الحجر عن الأرض ووضعه في حقيبته. وقبل أن يغادر، لمح تحت التراب قطعة معدنية صغيرة. أخرجها بمقدمة حذائه، فإذا بها تحمل شعارًا غريبًا: دائرة يتوسطها سبعة نجوم، وتحتها كلمة واحدة بلغة لم يتعلمها قط، ومع ذلك استطاع قراءتها.",
"«القديس».",
"رفع يامن رأسه نحو الجبال. لم يكن يعرف أن تلك الكلمة ستطارده لسنوات، ولا أن سبعة عوالم ستتغير بسبب قرار شاب خرج ذات ليلة بحثًا عن مصدر ضوء."
]],
["الفصل الثاني — الباب الذي لا يُرى",["عاد يامن إلى نيراف قبل الفجر بقليل، لكنه لم يدخل الورشة. وضع الحجر فوق الطاولة وراقبه حتى أشرقت الشمس. كلما اقترب منه شعر بدفء خفيف في كفه، وكأن الحجر يعرف أنه عاد.","وعندما أغمض عينيه ظهرت البوابات السبع من جديد. لكن هذه المرة كانت إحدى البوابات أقرب من البقية، وعلى سطحها ظهر نقش يشبه الشعار الذي وجده في الحفرة.","عندها ظهرت على جدار الورشة دائرة من الضوء، ثم تشكل داخلها إطار باب كامل. لم يكن هناك مقبض ولا مفصلات. فقط باب ينتظر أن يُفتح."]]
];
const nav=document.getElementById("chapters"),content=document.getElementById("content"),actions=document.getElementById("actions");
function show(i){nav.innerHTML=chapters.map((c,n)=>'<button class="'+(n===i?'active':'')+'" onclick="show('+n+')">'+(n+1)+'</button>').join("");content.innerHTML='<div class="chapter-label">الفصل '+(i+1)+' من '+chapters.length+'</div><h2>'+chapters[i][0]+'</h2>'+chapters[i][1].map(p=>'<p>'+p+'</p>').join("");actions.innerHTML=(i>0?'<button class="ghost" onclick="show('+(i-1)+')">← السابق</button> ':'')+(i<chapters.length-1?'<button class="primary" onclick="show('+(i+1)+')">التالي →</button>':'');window.scrollTo({top:0,behavior:"smooth"});}
show(0);
</script></body></html>
