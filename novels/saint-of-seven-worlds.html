const nav=document.getElementById("chapters"),contentEl=document.getElementById("content");
function controls(i){return '<button onclick="show('+(i-1)+' )" '+(i===0?'disabled':'')+'>← السابق</button><button class="primary" onclick="toggleIndex()">☰ الفهرس</button><button onclick="show('+(i+1)+' )" '+(i===chapters.length-1?'disabled':'')+'>التالي →</button>';}
function toggleIndex(){nav.classList.toggle("open");}
function show(i){
 if(i<0||i>=chapters.length)return;
 nav.innerHTML=chapters.map((c,n)=>'<button class="'+(n===i?'active':'')+'" onclick="show('+n+');nav.classList.remove(\'open\')">الفصل '+(n+1)+'</button>').join("");
 contentEl.innerHTML='<div class="chapter-label">الفصل '+(i+1)+'</div><h2>'+chapters[i][0]+'</h2>'+chapters[i][1].map(p=>'<p>'+p+'</p>').join("");
 document.getElementById("topActions").innerHTML=controls(i);
 document.getElementById("bottomActions").innerHTML=controls(i);
 window.scrollTo({top:0,behavior:"smooth"});
}
show(0);
</script></body></html>
