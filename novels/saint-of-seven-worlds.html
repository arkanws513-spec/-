<div class="reader-head"><div class="book-mark">✦</div><p class="eyebrow">رواية أصلية</p><h1>صعود قديس العوالم السبع</h1><p class="meta">تأليف: عالم الروايات • فانتازيا ومغامرة</p></div>

<script>
const chapters=[
["الفصل الأول — النجم الساقط","في الليلة التي انطفأت فيها ثلاثة أقمار، سقط نجم أزرق خلف جبال الصمت. كان يامن، شابًا يعمل في ورشة صغيرة عند أطراف مدينة نيراف، أول من رأى الضوء. وعندما اقترب من الحفرة وجد حجرًا أسود يتوسطه سبعة خطوط مضيئة. لم يكن يعرف أن لمسته الأولى ستربطه بعوالم لم يسمع بها أحد."],
["الفصل الثاني — الباب الذي لا يُرى","حمل يامن الحجر إلى منزله، لكنه اكتشف أن الخطوط السبعة تتحرك كلما أغمض عينيه. في الفجر ظهر على الجدار باب من ضوء. لم يكن بابًا إلى مكان قريب، بل إلى عالم آخر. وقبل أن يتراجع، سمع صوتًا هادئًا يقول: إن أردت معرفة سبب اختيارك، فعليك أن تبدأ الصعود."],
["الفصل الثالث — وادي الرماد","عبر يامن الباب وسقط في وادٍ تغطيه صخور رمادية. وجد أمامه برجًا مكسورًا وعلى بابه نقش قديم: لا يصل إلى القمة من يخاف أول خطوة. وبينما كان يقرأ، خرج مخلوق حجري من الظلام. لم ينتصر يامن بقوة السلاح، بل اكتشف أن الحجر الأزرق يستطيع إيقافه للحظات."],
["الفصل الرابع — أول اختبار","في قلب البرج وجد سبع درجات معلقة في الهواء. عند صعود الدرجة الأولى شعر بثقل العالم كله فوق كتفيه. عند الدرجة الثانية سمع أصوات أشخاص لم يلتق بهم قط. أما الثالثة فكشفت له ذكرى من طفولته. أدرك أن الطريق لا يختبر قوته فقط، بل إرادته أيضًا."],
["الفصل الخامس — حارسة المرآة","في قاعة بلا سقف قابل يامن فتاة تدعى لينا، كانت تحمل مرآة فضية. أخبرته أن كل من يحاول عبور العالم الأول يواجه نسخة من نفسه. لم يثق بها في البداية، لكن المرآة أظهرت له شيئًا لم يستطع تفسيره: سبعة عروش، وعرشًا ثامنًا خاليًا."],
["الفصل السادس — مدينة فوق الغيوم","وصل الاثنان إلى مدينة معلقة فوق سحابة عملاقة. أهلها لا يستخدمون الطرق، بل ينتقلون بين الجزر بواسطة جسور من الضوء. هناك علم يامن أن لقب قديس العوالم السبع ليس لقبًا يُمنح بالولادة، بل منزلة يصل إليها شخص يستطيع عبور العوالم السبعة دون أن يفقد نفسه."],
["الفصل السابع — سر الحجر الأزرق","اكتشف يامن أن الحجر ليس سلاحًا ولا كنزًا، وإنما مفتاح. كل خط من خطوطه مرتبط بعالم. وإذا اكتملت إضاءتها السبعة، يمكن فتح الطريق إلى العالم الأخير. لكن أحد الخطوط كان مظلمًا، وكأن شخصًا ما أغلق بابًا من الداخل."],
["الفصل الثامن — مطاردو الباب","ظهر رجال يرتدون أقنعة بيضاء وطالبوا يامن بتسليم الحجر. رفض، فبدأت مطاردة عبر المدينة. ساعدته لينا على الوصول إلى برج قديم، وهناك استخدما مرآة الفضة لعكس بوابة المطاردين. قبل أن تغلق البوابة، لمح يامن شعارًا يعرفه من كتب والده القديمة."],
["الفصل التاسع — اسم العدو","كان الشعار يعود إلى جماعة تسمى حراس الصفر، جماعة تبحث عن العروش السبعة منذ قرون. أخبرته لينا أن قائدهم لا يريد الوصول إلى العالم السابع، بل يريد منع أي شخص آخر من الوصول إليه. ولأول مرة فهم يامن أن رحلته قد تكون بداية صراع أكبر من حياته."],
["الفصل العاشر — بداية الصعود","وقف يامن أمام بوابة العالم الثاني. لم يعد الشاب الذي غادر ورشته في نيراف. أصبح يعرف أن كل خطوة ستكشف حقيقة جديدة، وأن الطريق قد يطلب منه التضحية بأشياء عزيزة عليه. رفع الحجر الأزرق، فأضاء الخط الثاني. ثم فُتح الباب، وظهر خلفه بحر لا نهاية له تحت سماء حمراء. كانت الرحلة الحقيقية قد بدأت."]
];
const nav=document.getElementById("chapters"),content=document.getElementById("content"),actions=document.getElementById("actions");
function show(i){nav.innerHTML=chapters.map((c,n)=>'<button class="'+(n===i?'active':'')+'" onclick="show('+n+')">'+(n+1)+'</button>').join("");content.innerHTML='<h2>'+chapters[i][0]+'</h2><p>'+chapters[i][1]+'</p>';actions.innerHTML=(i>0?'<button class="ghost" onclick="show('+(i-1)+')">← السابق</button> ':'')+(i<chapters.length-1?'<button class="primary" onclick="show('+(i+1)+')">التالي →</button>':'<p>نهاية الفصول التجريبية الأولى.</p>');window.scrollTo({top:0,behavior:"smooth"});}
show(0);
</script></body></html>
