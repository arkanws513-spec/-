<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>رسالة الغفران — عالم الروايات</title><link rel="stylesheet" href="../style.css">
<style>
.reader{max-width:850px;margin:auto}.reader-head{text-align:center;margin-bottom:28px}.reader-head .book-mark{font-size:45px}
.chapter-nav{display:none;gap:8px;flex-wrap:wrap;justify-content:center;margin:0 0 20px;padding:14px;background:#15121a;border:1px solid #2c2632;border-radius:14px}.chapter-nav.open{display:flex}
.chapter-nav button,.reader-actions button{background:#1b1721;color:#ddd;border:1px solid #3a3042;border-radius:9px;padding:10px 15px;cursor:pointer}.chapter-nav button.active{border-color:#c99a5b;color:#c99a5b}
.chapter{background:#15121a;border:1px solid #2c2632;border-radius:18px;padding:clamp(22px,5vw,45px);box-shadow:0 8px 30px #0003}.chapter h2{text-align:center;margin-bottom:30px}.chapter p{font-size:19px;line-height:2.25;color:#ddd;margin:0 0 22px}.reader-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:20px 0}.reader-actions .primary{background:#c99a5b;color:#17121a;border-color:#c99a5b}.meta,.note{color:#aaa}.chapter-label{color:#c99a5b;font-size:14px;text-align:center}
</style></head>
<body>
<header class="site-header"><div class="container nav"><a class="logo" href="../index.html">عالم <span>الروايات</span></a><a class="ghost" href="../index.html#novels">← المكتبة</a></div></header>
<main><section class="container section reader">
<div class="reader-head"><div class="book-mark">✒</div><p class="eyebrow">قراءة مجانية</p><h1>رسالة الغفران</h1><p class="meta">تأليف: أبو العلاء المعري • أدب عربي وكلاسيكي</p></div>
<div class="reader-actions" id="topActions"></div><div class="chapter-nav" id="chapters"></div><article class="chapter" id="content"></article><div class="reader-actions" id="bottomActions"></div>
<p class="note">سيُضاف المحتوى من مصدر يسمح بعرضه، مع الحفاظ على بيانات المصدر وحقوقه.</p>
</section></main><footer><div class="container">© 2026 عالم الروايات</div></footer>
<script>
const chapters=[
{title:"الفصل الأول — بداية الرسالة",text:"هذه مساحة القراءة الخاصة برسالة الغفران. يمكن تقسيم العمل إلى فصول والتنقل بينها من الأزرار أعلى وأسفل الصفحة. النص الكامل سيُعرض هنا من مصدر يسمح بذلك."},
{title:"الفصل الثاني — متابعة القراءة",text:"صُمم القارئ ليكون موحدًا مع بقية روايات الموقع، مع فهرس للفصول وزري السابق والتالي في أعلى الفصل وأسفله."}
];
const nav=document.getElementById("chapters"),content=document.getElementById("content");
function controls(i){return '<button onclick="show('+(i-1)+' )" '+(i===0?'disabled':'')+'>← السابق</button><button class="primary" onclick="toggleIndex()">☰ الفهرس</button><button onclick="show('+(i+1)+' )" '+(i===chapters.length-1?'disabled':'')+'>التالي →</button>';}
function toggleIndex(){nav.classList.toggle("open");}
function show(i){if(i<0||i>=chapters.length)return;nav.innerHTML=chapters.map((c,n)=>'<button class="'+(n===i?'active':'')+'" onclick="show('+n+');nav.classList.remove(\'open\')">الفصل '+(n+1)+'</button>').join("");content.innerHTML='<div class="chapter-label">الفصل '+(i+1)+'</div><h2>'+chapters[i].title+'</h2><p>'+chapters[i].text+'</p>';document.getElementById("topActions").innerHTML=controls(i);document.getElementById("bottomActions").innerHTML=controls(i);window.scrollTo({top:0,behavior:"smooth"});}
show(0);
</script></body></html>
